<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAI Contacts</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div class="config-container">
      <header>
        <h1>OAI Contacts</h1>
        <span class="subtitle" id="header-subtitle">Configuration</span>
      </header>

      <main id="app" class="hidden">
        <div class="toolbar">
          <button id="add-btn" class="btn secondary">+ Add Contact</button>
          <p id="status-msg" class="status"></p>
        </div>

        <div class="table-wrapper">
          <table id="contacts-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Agent / Members</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="contacts-body">
              <tr><td colspan="6" class="empty-row">No contacts yet.</td></tr>
            </tbody>
          </table>
        </div>
      </main>

      <p id="load-status" class="status center-status"></p>
    </div>

    <!-- Add / Edit modal -->
    <div id="modal-overlay" class="modal hidden">
      <div class="modal-box">
        <div class="modal-header">
          <span class="modal-title" id="modal-title">Add Contact</span>
          <button id="modal-close" class="remove-btn">✕</button>
        </div>

        <form id="contact-form">
          <input type="hidden" id="field-id" />

          <div class="form-row">
            <label>Name *</label>
            <input type="text" id="field-name" required />
          </div>
          <div class="form-row">
            <label>Description *</label>
            <textarea id="field-description" rows="2" required></textarea>
          </div>
          <div class="form-row">
            <label>Type *</label>
            <select id="field-type">
              <option value="individual">Individual</option>
              <option value="group">Group</option>
            </select>
          </div>
          <!-- Individual-only fields -->
          <div id="individual-fields">
            <div class="form-row">
              <label>Email</label>
              <input type="email" id="field-email" />
            </div>
            <div class="form-row">
              <label>Phone</label>
              <input type="text" id="field-phone" />
            </div>
          </div>

          <!-- Individual: agent selector -->
          <div id="individual-section">
            <div class="form-row">
              <label>Agent (optional)</label>
              <select id="field-agent">
                <option value="">— Not an agent contact —</option>
              </select>
            </div>
          </div>

          <!-- Group: member selector -->
          <div id="group-section" class="hidden">
            <div class="form-row">
              <label>Members</label>
              <div id="member-list"></div>
              <div class="member-add-row">
                <select id="member-add-select">
                  <option value="">— Select agent to add —</option>
                </select>
                <button type="button" id="member-add-btn" class="btn secondary">Add</button>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" id="cancel-btn" class="btn secondary">Cancel</button>
            <button type="submit" id="save-btn" class="btn primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
