name: Terraform Provider Release

on:
  push:
    tags:
      - 'tf-provider/v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: repositories/terraform-provider-orchestration-ai/go.mod

      - name: Derive semver from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#tf-provider/}" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.TF_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.TF_GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
          workdir: repositories/terraform-provider-orchestration-ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.value }}
